name: Build Bridge for Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - OJBetter_Bridge/**
      - .github/workflows/bridge-windows.yml
  pull_request:
    paths:
      - OJBetter_Bridge/**
      - .github/workflows/bridge-windows.yml

permissions:
  contents: read

concurrency:
  group: bridge-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            OJBetter_Bridge/requirements.txt
            OJBetter_Bridge/requirements-windows.txt
      - name: Install dependencies
        run: python -m pip install -r OJBetter_Bridge/requirements-windows.txt
      - name: Check dependencies
        run: python -m pip check
      - name: Run Bridge tests
        run: python -m unittest discover -s OJBetter_Bridge/tests -v
      - name: Build Windows package
        run: python OJBetter_Bridge/build_windows.py
      - name: Test packaged GUI
        run: python OJBetter_Bridge/tests/smoke_windows.py --package dist/OJBetter_Bridge --report dist/smoke
      - name: Upload verified package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: OJBetter_Bridge-windows-x64
          path: |
            dist/OJBetter_Bridge-windows-x64.zip
            dist/OJBetter_Bridge-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bridge-windows-diagnostics
          path: |
            dist/smoke/
            dist/build/server_gui/warn-server_gui.txt
          if-no-files-found: ignore
          retention-days: 7
